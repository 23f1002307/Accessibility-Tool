<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Accessibility Inspector</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h2>Accessibility Inspector</h2>

        <p>Status: <span id="status">Ready</span></p>

        <button id="startBtn">Mark Start (Ctrl+Alt+S)</button>
        <button id="endBtn">Mark End (Ctrl+Alt+E)</button>
        <button id="inspectBtn">Inspect Selection (Ctrl+Alt+C)</button>

    </div>

    <script src="popup.js"></script>

</body>
</html>
